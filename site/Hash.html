</fieldset>
</form>

<script>
function FormSubmit(Fo,e){
  function Show(t){Tx(bid('dResult'),t)}
  Cancel(e);
  if(e=Fo.File.value){
    AjaxGet(Fo.action+"?File="+Fo.File.value,{},function(resp,X){
      if(typeof resp!='string')resp=null;
      Show(resp||X.response||X.status||'No response?');
    });
  }else{
    Show("File missing");
    Fo.File.focus();
  }
  return!1
}
</script>
