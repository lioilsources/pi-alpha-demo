# Push → build → GitHub Pages (plan §3, §5.2).
# Source in site/ stays the author's original; the mobile layer and link rewriting to R2 are applied ONLY to the build.
# Disabling the mobile layer: Settings → Variables → MOBILE=0 (client sees a 1:1 migration, plan §6).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Build _site
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ASSETS_URL: ${{ vars.ASSETS_URL }}
          MOBILE: ${{ vars.MOBILE }}
          PREVIEW: ${{ vars.PREVIEW }}
        run: scripts/build_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
